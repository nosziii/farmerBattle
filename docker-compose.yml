version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=farmer
      - POSTGRES_PASSWORD=battle
      - POSTGRES_DB=farmerbattle

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=postgresql://farmer:battle@db/farmerbattle
      - ADMIN_TOKEN=changeme
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"

volumes:
  postgres_data:
